# Apps that get another GL_VENDOR / GL_RENDERER from ANGLE (tools/patches/aosp17-angle-gpuid.patch),
# mounted over /vendor/etc/gpuid.conf by pcvenusprobe.sh when Venus runs.
# <process name>|<GL_VENDOR>|<GL_RENDERER>
#
# Genshin Impact enables Vulkan only for GPU names in its own whitelist
# (assets/vulkan_gpu_list_config.txt: Adreno, Mali, Xclipse), matched against GL_RENDERER.
# Rendering stays on Venus and the NVIDIA driver.
com.miHoYo.GenshinImpact.vn|Qualcomm|Adreno (TM) 750
com.miHoYo.GenshinImpact|Qualcomm|Adreno (TM) 750
