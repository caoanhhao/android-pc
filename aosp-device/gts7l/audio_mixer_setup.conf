# Mixer routes of the gts7l sound card (sm8250, docs/gts7l-hal/audio.md), written by the
# audio HAL (hals/audio) at start. `<control> = <value>`: On/Off, a number, or an enum item.
# The HAL plays to PCM 0 (MultiMedia1) and records from PCM 1 (MultiMedia2,
# ro.vendor.audio.pc.capture_device in aosp_gts7l.mk): capture through MultiMedia1 returns
# silence. The DSP only powers a back end while a front end routed to it is open.

# Speakers: MultiMedia1 -> Primary TDM RX 0 -> the four CS35L41 (one TDM slot each).
PRIMARY_TDM_RX_0 Audio Mixer MultiMedia1 = On

# Built-in mic: DMIC1 -> VA macro DEC0 -> VA codec DMA TX 0 -> MultiMedia2. DMIC0-3 all
# pick up the speakers' tone at about the same level; the stock routing names no main mic.
# DEC0 at +16 dB (84 is 0 dB, 1 dB steps): at 0 dB the speakers' tone at full volume
# arrives at -51 dBFS.
VA DMIC MUX0 = DMIC1
VA DEC0 MUX = VA_DMIC
VA_AIF1_CAP Mixer DEC0 = On
VA_DEC0 Volume = 100
MultiMedia2 Mixer VA_CODEC_DMA_TX_0 = On
