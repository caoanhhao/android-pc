[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
# Kernel is linked at a fixed higher-half address (see kernel/linker.ld).
rustflags = ["-C", "relocation-model=static", "-C", "force-frame-pointers=yes"]
# `cargo run` boots the kernel, `cargo test` boots the test kernel; both in QEMU.
# Relative path is resolved against the directory containing `.cargo/`.
runner = "../tools/run-qemu.sh"
