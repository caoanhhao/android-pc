[package]
name = "ktests"
version = "0.1.0"
edition = "2024"
publish = false

# Standalone workspace: must not be picked up by kernel/'s workspace.
[workspace]

[lib]
name = "rt"
path = "src/lib.rs"
test = false
doctest = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = 1
